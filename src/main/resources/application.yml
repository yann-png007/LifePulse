server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lifepulse?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  spring:
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest
      virtual-host: /
      publisher-confirm-type: correlated # 开启消息确认
      publisher-returns: true # 开启消息回退
      listener:
        simple:
          retry:
            enabled: true # 开启消费重试
            max-attempts: 3 # 最大重试次数
            initial-interval: 1000ms # 初始重试间隔
  # Redis配置
redis:
  host: localhost
  port: 6379
  database: 0
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 2
      max-wait: -1

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义JWT配置
jwt:
  secret: LifePulseSecretKey666888999Life
  expire-time: 7200000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl